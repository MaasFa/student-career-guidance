<!DOCTYPE html>
<html>

<head>
    <title>Find a Mentor</title>
</head>

<body>

<h1>Find a Mentor</h1>

{% if mentors %}

{% for mentor in mentors %}

<hr>

<h2>{{ mentor.name }}</h2>

<p>
    <strong>Expertise:</strong>
    {{ mentor.expertise }}
</p>

<p>
    <strong>Experience:</strong>
    {{ mentor.experience }} years
</p>

<p>
    {{ mentor.bio }}
</p>

<a href="#">
    View Mentor
</a>

{% endfor %}

{% else %}

<p>No mentors available yet.</p>

{% endif %}

<br><br>

<a href="{% url 'dashboard' %}">
    Back to Dashboard
</a>

</body>

</html>
