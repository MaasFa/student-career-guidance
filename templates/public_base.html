{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}CareerPath{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>

<header class="public-navbar">

    <div class="public-navbar-inner">

        <a
            href="{% url 'home' %}"
            class="public-logo"
        >
            CareerPath
        </a>


        <nav class="public-nav">

        

            <a href="{% url 'login' %}">
                Login
            </a>

            <a
                href="{% url 'register' %}"
                class="btn btn-primary"
            >

                Get Started
            </a>

        </nav>

    </div>

</header>


<main class="public-main">

    {% block content %}
    {% endblock %}

</main>


</body>

</html>
