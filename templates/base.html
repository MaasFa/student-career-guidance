{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        CareerPath
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <div class="app-layout">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-logo">
                <h2>CareerPath</h2>
                <span>Career Guidance</span>
            </div>


            <nav class="sidebar-nav">

                <a href="{% url 'dashboard' %}">
                    🏠 Dashboard
                </a>

                <a href="{% url 'create_query' %}">
                    💬 My Queries
                </a>

                <a href="{% url 'mentor_list' %}">
                    👨‍🏫 Find Mentors
                </a>

                <a href="{% url 'workshop_list' %}">
                    📚 Workshops
                </a>

                <a href="#">
                    📅 My Sessions
                </a>

                <a href="#">
                    🧭 Career Roadmap
                </a>

                <a href="#">
                    👤 Profile
                </a>

            </nav>


            <div class="sidebar-bottom">

                <a href="{% url 'logout' %}">
                    🚪 Logout
                </a>

            </div>

        </aside>


        <!-- Main Content -->

        <main class="main-content">

            {% block content %}

            {% endblock %}

        </main>

    </div>

</body>

</html>
