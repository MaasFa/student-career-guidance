{% for msg in messages %}
    <div class="chat-bubble chat-bubble-{{ msg.role }}" style="display: flex; margin-bottom: 12px; {% if msg.role == 'user' %}justify-content: flex-end;{% else %}justify-content: flex-start;{% endif %}">
        <div style="max-width: 82%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; {% if msg.role == 'user' %}background: var(--primary); color: #fff; border-bottom-right-radius: 2px;{% else %}background: #f1f5f9; color: var(--text); border-bottom-left-radius: 2px; border: 1px solid var(--border);{% endif %}">
            <div style="font-size: 11px; font-weight: 700; opacity: 0.8; margin-bottom: 4px; text-transform: uppercase;">
                {% if msg.role == 'user' %}You{% else %}AI Career Coach{% endif %}
            </div>
            <div style="white-space: pre-wrap;">{{ msg.content }}</div>
            <div style="font-size: 10px; opacity: 0.6; text-align: right; margin-top: 4px;">
                {{ msg.created_at|date:"H:i" }}
            </div>
        </div>
    </div>
{% endfor %}
