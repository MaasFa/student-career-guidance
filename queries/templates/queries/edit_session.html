{% extends "base.html" %}

{% block title %}
Edit Personal Session
{% endblock %}


{% block content %}

<div class="page-header">

    <div>

        <h1>Edit Personal Session</h1>

        <p>
            Update the schedule and meeting details for this session.
        </p>

    </div>

</div>


<div class="card">

    <!-- Student Information -->

    <div class="form-group">

        <label>
            Student
        </label>

        <input
            type="text"
            value="{{ session.student.get_full_name|default:session.student.username }}"
            readonly
        >

    </div>


    <div class="form-group">

        <label>
            Query Topic
        </label>

        <input
            type="text"
            value="{{ session.student_query.topic }}"
            readonly
        >

    </div>


    <!-- Edit Session -->

    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label for="date">
                Session Date
            </label>

            <input
                type="date"
                id="date"
                name="date"
                value="{{ form.date.value|default:'' }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="start_time">
                Start Time
            </label>

            <input
                type="time"
                id="start_time"
                name="start_time"
                value="{{ form.start_time.value|default:'' }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="end_time">
                End Time
            </label>

            <input
                type="time"
                id="end_time"
                name="end_time"
                value="{{ form.end_time.value|default:'' }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="meeting_link">
                Meeting Link
            </label>

            <input
                type="url"
                id="meeting_link"
                name="meeting_link"
                value="{{ form.meeting_link.value|default:'' }}"
                placeholder="https://meet.google.com/..."
                required
            >

        </div>


        {% if form.errors %}

            <div class="form-errors">

                {{ form.errors }}

            </div>

        {% endif %}


        <div class="form-actions">

            <a
                href="{% url 'mentor_queries' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
