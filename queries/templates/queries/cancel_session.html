{% extends "base.html" %}

{% block title %}
Cancel Personal Session
{% endblock %}


{% block content %}

<div class="page-header">

    <div>

        <h1>Cancel Personal Session</h1>

        <p>
            Review the session before cancelling it.
        </p>

    </div>

</div>


<div class="card">

    <div class="form-group">

        <label>
            Student
        </label>

        <input
            type="text"
            value="{{ session.student.get_full_name|default:session.student.username }}"
            readonly
        >

    </div>


    <div class="form-group">

        <label>
            Query Topic
        </label>

        <input
            type="text"
            value="{{ session.student_query.topic }}"
            readonly
        >

    </div>


    <div class="form-group">

        <label>
            Session Date
        </label>

        <input
            type="text"
            value="{{ session.date|date:'d M Y' }}"
            readonly
        >

    </div>


    <div class="form-group">

        <label>
            Session Time
        </label>

        <input
            type="text"
            value="{{ session.start_time|time:'h:i A' }} - {{ session.end_time|time:'h:i A' }}"
            readonly
        >

    </div>


    <form method="POST">

        {% csrf_token %}

        <div class="form-actions">

            <a
                href="{% url 'mentor_queries' %}"
                class="btn btn-secondary"
            >
                Keep Session
            </a>

            <button
                type="submit"
                class="btn btn-danger"
            >
                Cancel Session
            </button>

        </div>

    </form>

</div>

{% endblock %}
