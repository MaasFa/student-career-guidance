{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CareerPath</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <h1>CareerPath</h1>
                <p>Student Career Guidance Platform</p>
            </div>

            <div class="auth-heading">
                <h2>Welcome back 👋</h2>
                <p>Login to continue your career journey.</p>
            </div>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                >
                    Login
                </button>

            </form>

            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="{% url 'register' %}">
                        Create one
                    </a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
